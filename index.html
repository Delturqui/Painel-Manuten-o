<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Manutenção</title>   
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #333333;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            text-decoration: none;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            transition: background-color 0.3s ease, transform 0.1s ease;
            color: white;
            display: inline-block;
            box-sizing: border-box;
            border: none;
            cursor: pointer;
            font-family: Arial, sans-serif;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Botão para enviar relatório (Azul) */
        .btn-enviar {
            background-color: #007bff;
        }
        .btn-enviar:hover {
            background-color: #0056b3;
        }

        /* Botão para ver relatórios (Verde) */
        .btn-ver {
            background-color: #28a745;
        }
        .btn-ver:hover {
            background-color: #218838;
        }

        /* Botão para o Mapa dos Parquímetros (Roxo/Violeta) */
        .btn-mapa {
            background-color: #6f42c1;
        }
        .btn-mapa:hover {
            background-color: #5a32a3;
        }

        /* Botão Sair (Vermelho) */
        .btn-sair {
            background-color: #dc3545;
            margin-top: 10px;
        }
        .btn-sair:hover {
            background-color: #bd2130;
        }
    </style>
</head>
<body>
        <!-- Mantenha toda a sua estrutura HTML e de estilos exatamente como está, apenas adicione este script antes de fechar a tag </body> -->
    <script>
        // Trava de segurança: impede o acesso direto se não estiver logado
        if (!localStorage.getItem('usuarioLogado')) {
            alert('Acesso restrito. Por favor, faça o login.');
            window.location.href = 'login.html';
        }

        // Função do botão Sair do Sistema
        function deslogar() {
            if (confirm('Deseja realmente sair do sistema?')) {
                localStorage.removeItem('usuarioLogado'); // Limpa a sessão
                window.location.href = 'login.html'; // Manda de volta para o login
            }
        }
    </script>
</body>

    <div class="container">
        <h1>Painel de Manutenção</h1>
        
        <div class="btn-group">
            <!-- Botão de Enviar Relatório -->
            <a href="enviar-relatorio.html" class="btn btn-enviar">Enviar Ocorrências</a>
            
            <!-- Botão de Ver Relatórios -->
            <a href="ver-relatorios.html" class="btn btn-ver">Ocorrências Registradas</a>
            
            <!-- Botão do Mapa dos Parquímetros -->
            <a href="https://estapar.olhovivo.online/" class="btn btn-mapa" target="_blank">Mapa dos Parquímetros</a>

            <!-- Botão Sair do Sistema -->
            <button onclick="deslogar()" class="btn btn-sair">Sair</button>
        </div>
    </div>

</body>
</html>
